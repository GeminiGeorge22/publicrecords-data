name: Build Etsy Pulse site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC: rebuild every report from the newest data in the repo
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (social card image)
        run: pip install --quiet pillow

      # Optional: export a fresh panel cut straight from the private HF dataset.
      # Runs only if an HF_READ_TOKEN repository secret is configured; skipped otherwise
      # (the box-side export pushes new cuts instead).
      - name: Export panel cut (optional)
        env:
          HF_READ_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        if: ${{ env.HF_READ_TOKEN != '' }}
        run: |
          python scripts/export_panel_cut.py
          if [ -n "$(git status --porcelain data/panel)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/panel
            git commit -m "panel cut $(date -u +%F) (Actions export)"
            git push
          fi

      - name: Build site
        run: python scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
